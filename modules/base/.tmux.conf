# Pass focus events (FocusIn/FocusOut) through to applications inside panes.
# Required for Neovim's autoread to fire when switching back to the terminal.
set-option -g focus-events on

# Tell tmux that the outer terminal supports true 24-bit RGB color.
# Without this, termguicolors in Neovim doesn't work and colors look wrong.
# Assumes the terminal running tmux supports true color (VTE-based terminals do).
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-overrides ",xterm-256color:Tc"

# tmux binds 'v' to rectangle-toggle by default, leaving charwise selection
# only on Space. Rebind to match vim: v = charwise, V = linewise (default),
# C-v = block.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Copy tmux's buffer to the system clipboard.
bind -T copy-mode-vi y send-keys -X copy-pipe 'xclip -selection clipboard -in'

# tmux >=3.2 rebound 'v' to rectangle-toggle by default; restore the classic vi-like
# behavior where 'v' begins a character-wise selection, and move rectangle-toggle to C-v.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
# If you use tmux in vi mode, use copy-mode-vi. If you use emacs mode, use copy-mode.
set -g mode-keys vi
set -g status-keys vi

# Flag a background window when it receives a bell (used by
# claude_notify_tmux.sh to surface Claude finishing / waiting on input).
set -g monitor-bell on
set -g visual-bell off
set -g window-status-bell-style 'fg=colour16,bg=colour141,bold'

# Manual "remind me later" flag, independent of the bell.
# The bell clears the moment you look at the window, which defeats the point
# if you glance over, decide to deal with it later, and want it to keep
# standing out. Prefix + m toggles a per-window @remind flag (see key
# bindings below), rendered as a muted dusty rose (no bg block, no bold) so
# it's a quiet marker rather than a loud one like the bell, and it persists
# until toggled off.
set -g window-status-format '#{?@remind,#[fg=#d3869b] #I:#W ,#[default] #I:#W }'
set -g window-status-current-format '#{?@remind,#[fg=#d3869b] [#I:#W] ,#[default] [#I:#W] }'

# Minimal status bar showing window numbers and names
set -g status on
set -g status-position bottom
set -g status-style 'bg=#282828 fg=#ebdbb2'
set -g status-left ''
set -g status-right ' %H:%M '
set -g window-status-current-style 'bg=#458588 fg=#282828 bold'

# Not a setting but just a reminder that prefix + ! will break a pane from the current window (i.e. a split) into its own window


######## Cheat Sheet ########
# - <leader> is currently set to <C-b>
# - most important keybindings starting with <leader> keypress
#       c         to create a new window
#       n/p       switches between next or previous windows
#       w         opens view of all windows
#       ,         renames current window
#       x         asks you if you want to kill the current pane and the processes in it
#       !         will create a new window from the current pane (i.e. break it out of the old window in split view) (don't think this is a custom remap but I am not sure about it)
#                 closing windows leaves gaps in numbering; new windows (c or !) auto-fill the lowest gap (via tmux-fill-gap script)
#       - and |   (custom remap) create a new pane in a split view
#       r         (custom remap) reload tmux conf
#       hjkl      (custom remap) allows me to jump between panes in a window
#       C + hjkl  (custom remap) resize panels
#       < and >   (custom remap) change order of windows
#       z         zoom/unzoom current pane (toggle it to full screen)
#       u and U   (custom remap) select another window and join it as a pane with the current one either vertically or horizontally
#       Alt+1..9  (no prefix needed) jump directly to window 1-9
#       m         (custom remap) toggle "remind me later" flag (muted dusty rose) on current window





#####################   Key bindings   #####################
# Reload the tmux config file using Prefix and then r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# more intuitive hotkeys for splitting a window (| and -)
bind | split-window -hc "#{pane_current_path}"
bind - split-window -vc "#{pane_current_path}"

# Swap windows around (< and >)
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# Resize panes using Ctrl + hjkl
bind -r C-j resize-pane -D 1
bind -r C-k resize-pane -U 1
bind -r C-h resize-pane -L 2
bind -r C-l resize-pane -R 2

# Zoom/unzoom the current pane (toggle full screen)
bind z resize-pane -Z

# Choose a window then join vertically or horizontally
bind u choose-window 'join-pane -s "%%"'
bind U choose-window 'join-pane -h -s "%%"'

# New window opens at the lowest free index and keeps the current path
bind c run-shell '~/Main/Scripts/Tmux/tmux-new-window.sh "#{pane_current_path}"'

# When renaming windows don't show the old name
bind-key , command-prompt -p 'new-name:' 'rename-window "%%"'

# testing to move around tmux with <leader>hjkl
bind 'h' select-pane -L
bind 'j' select-pane -D
bind 'k' select-pane -U
bind 'l' select-pane -R

# Cycle layouts repeatedly without re-pressing prefix (2s repeat timeout)
set -g repeat-time 2000
bind -r Space next-layout

# Mark the current window "remind me later" (muted dusty rose, see
# window-status-format above). Use this to re-flag a window whose bell you
# already dismissed by looking at it, so it keeps standing out until you
# come back to it.
#
# Setting the flag is delayed by 1s so you have time to switch off the pane
# first — otherwise the pane-focus-in hook below would clear it again the
# instant it's set, since you'd still be sitting on that same window.
# Pressing m again while already flagged clears it immediately (no delay
# needed to un-flag the window you're currently looking at).
bind-key m if-shell -F '#{@remind}' \
  'set-window-option -u @remind ; refresh-client -S' \
  'run-shell -b "sleep 1 && tmux set-window-option -t #{window_id} @remind on && tmux refresh-client -S"'

# Auto-clear the "remind me later" flag as soon as you come back to view
# that window/pane, mirroring how the bell flag clears when you look at it.
set-hook -g pane-focus-in 'if-shell -F "#{@remind}" "set-window-option -u @remind ; refresh-client -S"'

# Alt+number to switch windows without prefix.
# Uses :N form (session-relative index) which is the most explicit target syntax.
# If these do nothing, your terminal emulator is intercepting Alt+number before tmux sees it.
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

#####################   Key bindings end   #####################








# Activate the mouse in tmux
set -g mouse on

# Make indexing of windows start with 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Keep gaps when a window is closed; tmux-fill-gap assigns new windows the lowest free index instead.
set -g renumber-windows off

# Name all new windows "temp" by default, then fill any index gap left by a previously closed window.
set-hook -g after-new-window 'rename-window temp; run-shell "~/Main/Scripts/Tmux/tmux-pane-color.sh #{pane_id}"'
set-hook -ag after-new-window 'run-shell "~/Main/Scripts/Tmux/tmux-fill-gap #{window_index}"'
set-hook -g after-split-window 'run-shell "~/Main/Scripts/Tmux/tmux-pane-color.sh #{pane_id}"'








